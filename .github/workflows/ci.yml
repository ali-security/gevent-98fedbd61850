###
# Initially copied from
# https://github.com/actions/starter-workflows/blob/main/ci/python-package.yml
#
# Original comment follows.
###
###
# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions
###

###
# Important notes on GitHub actions:
#
# - We only get 2,000 free minutes a month
# - We only get 500MB of artifact storage
# - Cache storage is limited to 7 days and 5GB.
# - macOS minutes are 10x as expensive as Linux minutes
# - windows minutes are twice as expensive.
#
# So keep those workflows light.
#
# In December 2020, github only supports x86/64. If we wanted to test
# gevent on other architectures, we might be able to use docker
# emulation, but there's no native support.
#
# Another major downside: You can't just re-run the job for one part
# of the matrix. So if there's a transient test failure that hit, say, 3.8,
# to get a clean run every version of Python runs again. That's bad.
# https://github.community/t/ability-to-rerun-just-a-single-job-in-a-workflow/17234/65

name: gevent testing


# Triggers the workflow on push or pull request events
on:
  workflow_dispatch: {}
# Limiting to particular branches might be helpful to conserve minutes.
#on:
  # push:
  #   branches: [ $default-branch ]
  # pull_request:
  #   branches: [ $default-branch ]

env:
  # Weirdly, this has to be a top-level key, not ``defaults.env``
  PYTHONHASHSEED: 8675309
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
  PIP_UPGRADE_STRATEGY: eager
  # Don't get warnings about Python 2 support being deprecated. We
  # know. The env var works for pip 20.
  PIP_NO_PYTHON_VERSION_WARNING: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  GEVENTSETUP_EV_VERIFY: 1
  # Disable some warnings produced by libev especially and also some Cython generated code.
  # These are shared between GCC and clang so it must be a minimal set.
  # TODO: Figure out how to set env vars per platform without resorting to inline scripting.
  # Note that changing the value of these variables invalidates configure caches
  CFLAGS: -Ofast -pipe -Wno-strict-aliasing -Wno-comment
  CPPFLAGS: -DEV_VERIFY=1
  # Uploading built wheels for releases.
  # TWINE_PASSWORD is encrypted and stored directly in the
  # travis repo settings.
  TWINE_USERNAME: __token__
  ###
  # caching
  ###
  CCACHE_DIR: ~/.ccache
  CC: "ccache gcc"
  CCACHE_NOCPP2: true
  CCACHE_SLOPPINESS: file_macro,time_macros,include_file_ctime,include_file_mtime
  CCACHE_NOHASHDIR: true
  # Resolve every pip install against the index as it stood at the 21.12.0 release.
  PIP_INDEX_URL: https://:2021-12-11T20:33:45Z@time-machines-pypi.sealsecurity.io/

  #


jobs:
  manylinux_arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    # We use a regular Python matrix entry to share as much code as possible.
    strategy:
      matrix:
        python-version: [3.9]

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache ~/.ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache/
          key: ${{ runner.os }}-ccache_manylinux-${{ matrix.python-version }}
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip_manylinux_aarch64-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Update pip
        run: pip install -U pip
      - name: Build and test gevent
        # Skip the bulk of the tests, running them emulated on arm takes
        # forever. Likewise, don't build or even configure c-ares; in the emulated platform
        # it takes at least 15 minutes and often much longer.
        env:
          DOCKER_IMAGE: quay.io/pypa/manylinux2014_aarch64:2021-12-05-142ef77
          GEVENTTEST_SKIP_ALL: 1
          GEVENTSETUP_DISABLE_ARES: 1
        run: scripts/releases/make-manylinux
      - name: Upload gevent wheels
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*whl
          name: manylinux_aarch64_wheels.zip
          if-no-files-found: error
      - name: Restore pip cache permissions
        run: sudo chown -R $(whoami) ${{ steps.pip-cache.outputs.dir }}

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.7, pypy-2.7, pypy-3.7, 3.6, 3.7, 3.8, 3.9, '3.10.0']
        # ubuntu-latest is at least 20.04. But this breaks the SSL
        # tests because Ubuntu increased the default OpenSSL
        # strictness.
        # The standard library has only been updated with fixes for
        # this in 3.8+.
        os: [ubuntu-22.04, macos-15-intel, ubuntu-latest]
        exclude:
          - os: macos-15-intel
            python-version: pypy-2.7
          - os: macos-15-intel
            python-version: pypy-3.7
          - os: macos-15-intel
            python-version: 3.6
          - os: ubuntu-latest
            python-version: 2.7
          - os: ubuntu-latest
            python-version: pypy-2.7
          - os: ubuntu-latest
            python-version: pypy-3.7
          - os: ubuntu-latest
            python-version: 3.6
          - os: ubuntu-latest
            python-version: 3.7
          - os: ubuntu-22.04
            python-version: 3.8
          - os: ubuntu-22.04
            python-version: 3.9
          - os: ubuntu-22.04
            python-version: '3.10.0'
        include:
          # Interpreters as setup-python provided them at the 21.12.0 release
          # (built for macOS 10.14, matching the published wheel tags).
          - os: macos-15-intel
            python-version: 3.7
            setup-version: '3.7.12'
          - os: macos-15-intel
            python-version: 3.8
            macos-pkg: 3.8.10/python-3.8.10-macosx10.9.pkg
          - os: macos-15-intel
            python-version: 2.7
            macos-pkg: 2.7.18/python-2.7.18-macosx10.9.pkg
          - os: macos-15-intel
            python-version: 3.9
            setup-version: '3.9.9'
          # CPython 3.6/3.7's ssl module does not work with the OpenSSL 3 of
          # current Ubuntu images; upstream ran these on ubuntu-18.04 (OpenSSL 1.1.1).
          - os: ubuntu-22.04
            python-version: 3.6
            openssl11: true
          - os: ubuntu-22.04
            python-version: 3.7
            openssl11: true
          # setup-python has no 3.10.0 build for current Ubuntu images.
          - os: ubuntu-latest
            python-version: '3.10.0'
            setup-version: '3.10'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Build OpenSSL 1.1.1
        if: matrix.openssl11
        run: |
          unset CC CFLAGS CPPFLAGS
          curl -sSL https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-1.1.1w"
          ./config --prefix=/opt/openssl11 --openssldir=/opt/openssl11/ssl shared > /dev/null
          make -j4 > /dev/null
          sudo make install_sw > /dev/null
          sudo mkdir -p /opt/openssl11/ssl
          sudo ln -s /etc/ssl/certs /opt/openssl11/ssl/certs
      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ !matrix.macos-pkg }}
        uses: MatteoH2O1999/setup-python@v4
        # Keep the gevent build flags out of interpreters built from source;
        # the openssl11 legs build CPython against the OpenSSL 1.1.1 above.
        env:
          CFLAGS: ""
          CPPFLAGS: ${{ matrix.openssl11 && '-I/opt/openssl11/include' || '' }}
          LDFLAGS: ${{ matrix.openssl11 && '-L/opt/openssl11/lib -Wl,-rpath,/opt/openssl11/lib' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.openssl11 && '/opt/openssl11/lib/pkgconfig' || '' }}
          CC: ""
        with:
          python-version: ${{ matrix.setup-version || matrix.python-version }}
          cache-build: ${{ !matrix.openssl11 }}
          allow-build: ${{ matrix.openssl11 && 'force' || 'allow' }}
      - name: Set up Python ${{ matrix.python-version }} (python.org, macOS)
        # setup-python no longer carries a 10.14-era build of these; use the
        # python.org x86_64 installer and target macOS 10.14 like the others.
        if: matrix.macos-pkg
        run: |
          curl -sSLO https://www.python.org/ftp/python/${{ matrix.macos-pkg }}
          sudo installer -pkg "$(basename ${{ matrix.macos-pkg }})" -target /
          fw=/Library/Frameworks/Python.framework/Versions/${{ matrix.python-version }}
          mkdir -p "$RUNNER_TEMP/pybin"
          ln -sf "$fw/bin/python${{ matrix.python-version }}" "$RUNNER_TEMP/pybin/python"
          ln -sf "$fw/bin/pip${{ matrix.python-version }}" "$RUNNER_TEMP/pybin/pip"
          # python.org builds bundle their own OpenSSL with no CA store; this is
          # the installer's own post-install step (pip install certifi + cert.pem
          # link), needed by the networked HTTPS tests (test__socket_ssl).
          "/Applications/Python ${{ matrix.python-version }}/Install Certificates.command"
          echo "$fw/bin" >> $GITHUB_PATH
          echo "$RUNNER_TEMP/pybin" >> $GITHUB_PATH
          echo "MACOSX_DEPLOYMENT_TARGET=10.14" >> $GITHUB_ENV
          "$fw/bin/python${{ matrix.python-version }}" -m pip install -U pip
      - name: Provide Cython 3.0a9
        # gevent 21.12.0 needs Cython >= 3.0a9 to build, and every Cython 3.0
        # alpha has since been deleted from PyPI. Build it from its release tag
        # and offer it to pip (isolated build envs included) via PIP_FIND_LINKS.
        shell: bash
        run: |
          unset CC CFLAGS CPPFLAGS
          python -m pip install -U wheel
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/cython" https://github.com/cython/cython/archive/refs/tags/3.0.0a9.tar.gz
          if [ "${{ matrix.openssl11 }}" = "true" ]; then
            # The interpreter built from source here ships no `pip` script, so the
            # job's bare `pip` would be the system Python's; point it at this one.
            mkdir -p "$RUNNER_TEMP/pipshim"
            printf '#!/bin/sh\nexec "%s" -m pip "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/pipshim/pip"
            chmod +x "$RUNNER_TEMP/pipshim/pip"
            echo "$RUNNER_TEMP/pipshim" >> "$GITHUB_PATH"
          fi
          echo "PIP_FIND_LINKS=$RUNNER_TEMP/cython" >> "$GITHUB_ENV"
      - name: Install ccache (ubuntu)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache sed gcc
      - name: Install ccache (macos)
        if: startsWith(runner.os, 'macOS')
        run: |
          brew install ccache
          echo CFLAGS=$CFLAGS -Wno-parentheses-equality >>$GITHUB_ENV
      - name: Set coverage status
        # coverage is too slow on PyPy. We can't submit it from macOS (see that action),
        # so don't bother taking the speed hit there either.
        if: ${{ !startsWith(matrix.python-version, 'pypy') && startsWith(runner.os, 'Linux') }}
        run: |
          echo G_USE_COV=--coverage >> $GITHUB_ENV

      ###
      # Caching.
      # This actually *restores* a cache and schedules a cleanup action
      # to save the cache. So it must come before the thing we want to use
      # the cache.
      ###
      - name: Cache ~/.ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache/
          key: ${{ runner.os }}-ccache2-${{ matrix.python-version }}

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache config.cache
        # Store the configure caches. Having a cache can speed up c-ares
        # configure from 2-3 minutes to 20 seconds.
        uses: actions/cache@v4
        with:
          path: deps/*/config.cache
          # XXX: This should probably include a hash of each configure
          # script We don't have a restore-keys that doesn't include
          # the CFLAGS becouse the scripts fail to run if they get
          # different CFLAGS, CC, CPPFLAGS, etc, and GHA offers no way
          # to manually clear the cache. At one time, we had a
          # restore-key configured, and it still seems to be used even
          # without that setting here. The whole thing is being
          # matched even without the CFLAGS matching. Perhaps the - is
          # a generic search separator?
          key: ${{ runner.os }}-${{ matrix.os }}-configcache3-${{ matrix.python-version }}-${{ env.CFLAGS }}

      # Install gevent. Yes, this will create different files each time,
      # leading to a fresh cache. But because of CCache stats, we had already been doing
      # that (before we learned about CCACHE_NOSTATS).
      # We don't install using the requirements file for speed (reduced deps) and because an editable
      # install doesn't work in the cache.
      # First, the build dependencies (see setup.cfg)
      # so that we don't have to use build isolation and can better use the cache;
      # Note that we can't use -U for cffi and greenlet on PyPy.
      # The -q is because Pypy-2.7 sometimes started raising
      #   UnicodeEncodeError: 'ascii' codec can't encode character u'\u2588' in position 6: ordinal not in range(128)
      # when downloading files. This started sometime in mid 2020. It's from
      # pip's vendored progress.bar class.
      - name: Install dependencies
        run: |
          pip install -U pip
          # Hosted pip (25+) dropped the setup.py-develop fallback the editable
          # install below relies on; use the release-era pip.
          pip install 'pip<=21.3.1'
          pip install -U -q setuptools wheel twine
          # Hosted interpreters ship a setuptools newer than this release and -U never
          # downgrades; the release-era one keeps bdist_wheel coming from wheel 0.37.0.
          pip install -q 'setuptools<=59.5.0'
          # faulthandler (optional, py2.7 only) has been deleted from PyPI.
          pip install -q -U 'cffi;platform_python_implementation=="CPython"'
          pip install -q -U 'cython>=3.0a9'
          pip install 'greenlet>=1.0a1;platform_python_implementation=="CPython"'

      - name: Build gevent sdist
        # The released sdist was made on macOS with Python 3.10 from a clean
        # tree (setup.py cythonizes on import, so it carries the generated C).
        if: matrix.python-version == '3.10.0' && startsWith(runner.os, 'macOS')
        run: |
          python setup.py sdist
          twine check dist/*.tar.gz
      - name: Build gevent
        run: |
          # Next, build the wheel *in place*. This helps ccache, and also lets us cache the configure
          # output (pip install uses a random temporary directory, making this difficult)
          python setup.py build_ext -i
          python setup.py bdist_wheel
      - name: Check gevent build
        run: |
          ls -l dist
          twine check dist/*
      - name: Upload gevent wheel
        uses: actions/upload-artifact@v4
        with:
          name: gevent-${{ runner.os }}-${{ matrix.python-version }}.whl
          path: dist/*whl
          if-no-files-found: error
      - name: Upload gevent sdist
        if: matrix.python-version == '3.10.0' && startsWith(runner.os, 'macOS')
        uses: actions/upload-artifact@v4
        with:
          name: gevent-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Install gevent
        # I'd prefer to install the wheel in non-editable mode, but that seems to
        # screw up coverage reporting.
        run: |
          pip install -U -e .[test]
      - name: Report environment details
        run: |
          python --version
          python -c 'import greenlet; print(greenlet, greenlet.__version__)'
          python -c 'import gevent; print(gevent.__version__)'
          python -c 'from gevent._compat import get_clock_info; print(get_clock_info("perf_counter"))'
          python -c 'import gevent.core; print(gevent.core.loop)'
          python -c 'import gevent.ares; print(gevent.ares)'
          ccache -s
      - name: Prepare the Linux test environment (bash as /bin/sh, tipc)
        # Ubuntu's dash keeps a parent shell for `sh -c 'sleep 3'` instead of
        # exec'ing it, so test__subprocess's
        # test_run_with_shell_timeout_and_capture_output kills only the shell
        # and then waits ~3s for the orphaned sleep to close the pipes.
        # bash (the /bin/sh of the manylinux images, where it passes) execs.
        # Also load the TIPC kernel module for test_socket's TIPC tests.
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo ln -sf bash /bin/sh
          if sudo modprobe tipc; then echo "tipc module loaded"; else echo "tipc kernel module unavailable on this runner kernel"; fi
      - name: "Tests: Basic"
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV
      # For the CPython interpreters, unless we have reason to expect
      # different behaviour across the versions (e.g., as measured by coverage)
      # it's sufficient to run the full suite on the current version
      # and oldest version.
      - name: "Tests: subproccess and FileObjectThread"
        # Now, the non-default threaded file object.
        # In the past, we included all test files that had a reference to 'subprocess'' somewhere in their
        # text. The monkey-patched stdlib tests were specifically included here.
        # However, we now always also test on AppVeyor (Windows) which only has GEVENT_FILE=thread,
        # so we can save a lot of CI time by reducing the set and excluding the stdlib tests without
        # losing any coverage.
        env:
          GEVENT_FILE: thread
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV `(cd src/gevent/tests >/dev/null && ls test__*subprocess*.py)`
      - name: "Tests: c-ares resolver"
        # This sometimes fails on mac. Also, save mac minutes.
        if: (matrix.python-version == 2.7 || matrix.python-version == 3.9) && startsWith(runner.os, 'Linux')
        env:
          GEVENT_RESOLVER: ares
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV --ignore tests_that_dont_use_resolver.txt
      - name: "Tests: dnspython resolver"
        # This has known issues on Pypy-3.6. Also, save mac minutes.
        if: (matrix.python-version == 2.7 || matrix.python-version == 3.9) && startsWith(runner.os, 'Linux')
        env:
          GEVENT_RESOLVER: dnspython
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV --ignore tests_that_dont_use_resolver.txt
      - name: "Tests: leakchecks"
        # Run the leaktests; this seems to be extremely slow on Python 3.7
        # XXX: Figure out why. Can we reproduce locally?
        if: matrix.python-version == 2.7 && startsWith(runner.os, 'Linux')
        env:
          GEVENTTEST_LEAKCHECK: 1
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance --ignore tests_that_dont_do_leakchecks.txt
      - name: "Tests: PURE_PYTHON"
        # No compiled cython modules on CPython, using the default backend. Get coverage here.
        # We should only need to run this for a single Python 2 and a Python 3
        if: (matrix.python-version == 2.7 || matrix.python-version == 3.9) && startsWith(runner.os, 'Linux')
        env:
          PURE_PYTHON: 1
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance --coverage
      - name: "Tests: libuv"
        if: (matrix.python-version == 2.7 || matrix.python-version == 3.9)
        env:
          GEVENT_LOOP: libuv
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV
      - name: "Tests: libev-cffi"
        if: (matrix.python-version == 2.7 || matrix.python-version == 3.9) && startsWith(runner.os, 'Linux')
        env:
          GEVENT_LOOP: libev-cffi
        run: |
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance $G_USE_COV
      - name: Test summaries of every test step in this job
        if: always()
        shell: bash
        run: |
          f="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/gevent-test-summaries.txt"
          if [ -f "$f" ]; then cat "$f"; else echo "No gevent test step ran in this job."; fi

  test_no_embed:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: [2.7, 3.9]
        os: [ubuntu-22.04]
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v4
        # Keep the gevent build flags out of interpreters built from source.
        env:
          CFLAGS: ""
          CPPFLAGS: ""
          CC: ""
        with:
          python-version: ${{ matrix.setup-version || matrix.python-version }}
          cache-build: true
          allow-build: allow
      - name: Provide Cython 3.0a9
        # gevent 21.12.0 needs Cython >= 3.0a9 to build, and every Cython 3.0
        # alpha has since been deleted from PyPI. Build it from its release tag
        # and offer it to pip (isolated build envs included) via PIP_FIND_LINKS.
        shell: bash
        run: |
          unset CC CFLAGS CPPFLAGS
          python -m pip install -U wheel
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/cython" https://github.com/cython/cython/archive/refs/tags/3.0.0a9.tar.gz
          if [ "${{ matrix.openssl11 }}" = "true" ]; then
            # The interpreter built from source here ships no `pip` script, so the
            # job's bare `pip` would be the system Python's; point it at this one.
            mkdir -p "$RUNNER_TEMP/pipshim"
            printf '#!/bin/sh\nexec "%s" -m pip "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/pipshim/pip"
            chmod +x "$RUNNER_TEMP/pipshim/pip"
            echo "$RUNNER_TEMP/pipshim" >> "$GITHUB_PATH"
          fi
          echo "PIP_FIND_LINKS=$RUNNER_TEMP/cython" >> "$GITHUB_ENV"
      - name: Install ccache (ubuntu)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache sed gcc
      - name: Cache ~/.ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache/
          key: ${{ runner.os }}-ccache2_embed-${{ matrix.python-version }}

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: pip cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip_emded-${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache config.cache
        # Store the configure caches. Having a cache can speed up c-ares
        # configure from 2-3 minutes to 20 seconds.
        uses: actions/cache@v4
        with:
          path: deps/*/config.cache
          # XXX: This should probably include a hash of each configure
          # script We don't have a restore-keys that doesn't include
          # the CFLAGS becouse the scripts fail to run if they get
          # different CFLAGS, CC, CPPFLAGS, etc, and GHA offers no way
          # to manually clear the cache. At one time, we had a
          # restore-key configured, and it still seems to be used even
          # without that setting here. The whole thing is being
          # matched even without the CFLAGS matching. Perhaps the - is
          # a generic search separator?
          key: ${{ runner.os }}-${{ matrix.os }}-configcache_embed-${{ matrix.python-version }}-${{ env.CFLAGS }}
      - name: Install dependencies
        run: |
          pip install -U pip
          # Hosted pip (25+) dropped the setup.py-develop fallback the editable
          # install below relies on; use the release-era pip.
          pip install 'pip<=21.3.1'
          pip install -U -q setuptools wheel twine
          # Hosted interpreters ship a setuptools newer than this release and -U never
          # downgrades; the release-era one keeps bdist_wheel coming from wheel 0.37.0.
          pip install -q 'setuptools<=59.5.0'
          # faulthandler (optional, py2.7 only) has been deleted from PyPI.
          pip install -q -U 'cffi;platform_python_implementation=="CPython"'
          pip install -q -U 'cython>=3.0a5'
          pip install 'greenlet>=1.0a1;platform_python_implementation=="CPython"'

      - name: build libs and gevent
        env:
          GEVENTSETUP_EMBED: 0
          GEVENTSETUP_EV_VERIFY: 1
        run: |
          # These need to be absolute paths
          export BUILD_LIBS="$HOME/.libs/"
          mkdir -p $BUILD_LIBS
          export LDFLAGS=-L$BUILD_LIBS/lib
          export CPPFLAGS="-I$BUILD_LIBS/include"
          env | sort
          echo which sed? `which sed`
          echo LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$BUILD_LIBS/lib >>$GITHUB_ENV
          (pushd deps/libev && sh ./configure -C --prefix=$BUILD_LIBS && make install && popd)
          (pushd deps/c-ares && sh ./configure -C --prefix=$BUILD_LIBS && make -j4 install && popd)

          (pushd deps/libuv && ./autogen.sh && sh ./configure -C --disable-static --prefix=$BUILD_LIBS && make -j4 install && popd)
          # libev builds a manpage each time, and it includes today's date, so it frequently changes.
          # delete to avoid repacking the archive
          rm -rf $BUILD_LIBS/share/man/
          ls -l $BUILD_LIBS $BUILD_LIBS/lib $BUILD_LIBS/include
          python setup.py bdist_wheel
          pip uninstall -y gevent
          pip install -U `ls dist/*whl`[test]
          # Test that we're actually linking
          # to the .so file.
          objdump -p build/lib*/gevent/libev/_corecffi*so | grep "NEEDED.*libev.so"
          objdump -p build/lib*/gevent/libev/corecext*so | grep "NEEDED.*libev.so"
          objdump -p build/lib*/gevent/libuv/_corecffi*so | grep "NEEDED.*libuv.so"
          objdump -p build/lib*/gevent/resolver/cares*so | grep "NEEDED.*libcares.so"
      - name: Prepare the Linux test environment (bash as /bin/sh, tipc)
        # Ubuntu's dash keeps a parent shell for `sh -c 'sleep 3'` instead of
        # exec'ing it, so test__subprocess's
        # test_run_with_shell_timeout_and_capture_output kills only the shell
        # and then waits ~3s for the orphaned sleep to close the pipes.
        # bash (the /bin/sh of the manylinux images, where it passes) execs.
        # Also load the TIPC kernel module for test_socket's TIPC tests.
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo ln -sf bash /bin/sh
          if sudo modprobe tipc; then echo "tipc module loaded"; else echo "tipc kernel module unavailable on this runner kernel"; fi
      - name: test non-embedded
        run: |
          # Verify that we got non-embedded builds
          python -c 'import gevent.libev.corecffi as CF; assert not CF.LIBEV_EMBED'
          python -c 'import gevent.libuv.loop as CF; assert not CF.libuv.LIBUV_EMBED'
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance
      - name: Test summaries of every test step in this job
        if: always()
        shell: bash
        run: |
          f="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/gevent-test-summaries.txt"
          if [ -f "$f" ]; then cat "$f"; else echo "No gevent test step ran in this job."; fi

  linux_wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        config:
          # Python version, docker image, short name
          # Images pinned to the last tag before the 21.12.0 release.
          - ["3.9", "quay.io/pypa/manylinux2010_x86_64:2021-12-05-142ef77", "manylinux"]
          - ["3.9", "quay.io/pypa/musllinux_1_1_x86_64:2021-12-05-142ef77", "musllinux"]
    name: ${{ matrix.config[2] }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.config[0] }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config[0] }}
      - name: Cache ~/.ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache/
          key: ${{ runner.os }}-ccache_${{ matrix.config[2] }}-${{ matrix.config[0] }}
      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "::set-output name=dir::$(pip cache dir)"

      - name: pip cache
        uses: actions/cache@v4
        # Be careful not to accidentally share caches. The wheel names
        # may be the same (e.g.,
        # psutil-5.8.0-cp310-cp310-linux_x86_64.whl) but they aren't
        # compatible across glibc/musl.
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip_${{ matrix.config[2] }}_x8664-${{ matrix.config[0] }}

      - name: Update pip
        run: pip install -U pip
      - name: Build and test gevent
        # An alternate way to do this is to run the container directly with a uses:
        # and then the script runs inside it. That may work better with caching.
        # See https://github.com/pyca/bcrypt/blob/f6b5ee2eda76d077c531362ac65e16f045cf1f29/.github/workflows/wheel-builder.yml
        # The 2010 image is the last one that comes with Python 2.7,
        # and only up through the tag 2021-02-06-3d322a5.
        # Unfortunately, this does not include Python 3.10, and the
        # images that include Python 3.10 don't have 2.7. Sigh.
        env:
          DOCKER_IMAGE: ${{ matrix.config[1] }}
          GEVENT_MANYLINUX_NAME: ${{ matrix.config[2] }}

        run: scripts/releases/make-manylinux
      - name: Upload gevent wheels
        uses: actions/upload-artifact@v4
        with:
          path: wheelhouse/*whl
          name: ${{ matrix.config[2] }}_x86_64_wheels.zip
          if-no-files-found: error
      - name: Restore pip cache permissions
        run: sudo chown -R $(whoami) ${{ steps.pip-cache.outputs.dir }}

  windows:
    # Port of appveyor.yml (upstream builds and tests the Windows wheels on
    # AppVeyor, which does not run on this fork): same interpreter matrix,
    # same build, test and wheel commands.
    runs-on: windows-2022
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit, built and tested
          - {python-version: "pypy-2.7-v7.3.6", arch: x64}
          - {python-version: "3.10.0", arch: x64}
          - {python-version: "3.9", arch: x64}
          - {python-version: "2.7", arch: x64}
          - {python-version: "3.8", arch: x64}
          - {python-version: "3.7", arch: x64}
          - {python-version: "3.6", arch: x64}
          # 32-bit, wheel only (no testing)
          - {python-version: "3.9", arch: x86, wheel-only: true}
          - {python-version: "3.8", arch: x86, wheel-only: true}
          - {python-version: "3.7", arch: x86, wheel-only: true}
          - {python-version: "3.6", arch: x86, wheel-only: true}
          - {python-version: "2.7", arch: x86, wheel-only: true}
    env:
      # The AppVeyor environment these builds and tests were written for.
      APPVEYOR: "True"
      CFLAGS: ""
      CPPFLAGS: ""
      CC: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Drop .git
        # AppVeyor's shallow_clone fetched a zip without .git; gevent's setup only
        # makes c-ares optional (not built on Windows) outside a git checkout.
        run: rm -rf .git
      - name: Set up Python ${{ matrix.python-version }} ${{ matrix.arch }}
        if: matrix.python-version != '2.7'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
      - name: Set up Python 2.7 ${{ matrix.arch }}
        # The setup-python manifest no longer carries 2.7; use the python.org
        # installer, as AppVeyor's C:\Python27 images did.
        if: matrix.python-version == '2.7'
        shell: pwsh
        run: |
          $suffix = if ('${{ matrix.arch }}' -eq 'x64') { '.amd64' } else { '' }
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/2.7.18/python-2.7.18$suffix.msi" -OutFile python27.msi
          $target = "C:\Python27-${{ matrix.arch }}"
          Start-Process msiexec.exe -Wait -ArgumentList "/i python27.msi /qn ALLUSERS=1 TARGETDIR=$target"
          Remove-Item python27.msi
          "$target" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$target\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install Microsoft Visual C++ Compiler for Python 2.7
        # AppVeyor's Visual Studio 2015 image shipped it; Microsoft no longer
        # hosts the installer, so fetch a mirror and pin its sha256.
        if: matrix.python-version == '2.7'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/reider-roque/sulley-win-installer/raw/master/VCForPython27.msi -OutFile VCForPython27.msi
          if ((Get-FileHash VCForPython27.msi -Algorithm SHA256).Hash -ne '070474DB76A2E625513A5835DF4595DF9324D820F9CC97EAB2A596DCBC2F5CBF') { throw 'VCForPython27.msi checksum mismatch' }
          Start-Process msiexec.exe -Wait -ArgumentList '/i VCForPython27.msi /quiet /norestart ALLUSERS=1'
          Remove-Item VCForPython27.msi
      - name: Report Python
        run: |
          python --version
          python -c "import struct; print(struct.calcsize('P') * 8)"
          python -mensurepip -U --user
          python -mpip install -U --user pip
      - name: Provide Cython 3.0a9
        # gevent 21.12.0 needs Cython >= 3.0a9 to build, and every Cython 3.0
        # alpha has since been deleted from PyPI. Build it from its release tag
        # and offer it to pip (isolated build envs included) via PIP_FIND_LINKS.
        shell: bash
        run: |
          unset CC CFLAGS CPPFLAGS
          python -m pip install -U wheel
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/cython" https://github.com/cython/cython/archive/refs/tags/3.0.0a9.tar.gz
          if [ "${{ matrix.openssl11 }}" = "true" ]; then
            # The interpreter built from source here ships no `pip` script, so the
            # job's bare `pip` would be the system Python's; point it at this one.
            mkdir -p "$RUNNER_TEMP/pipshim"
            printf '#!/bin/sh\nexec "%s" -m pip "$@"\n' "$(command -v python)" > "$RUNNER_TEMP/pipshim/pip"
            chmod +x "$RUNNER_TEMP/pipshim/pip"
            echo "$RUNNER_TEMP/pipshim" >> "$GITHUB_PATH"
          fi
          echo "PIP_FIND_LINKS=$RUNNER_TEMP/cython" >> "$GITHUB_ENV"
      - name: Build gevent
        run: |
          python -m pip install -U wheel cython setuptools cffi
          if [ "${{ matrix.wheel-only }}" != "true" ]; then python -m pip install -U -e .[test]; fi
      - name: Prefer IPv4 for localhost
        # The tests bind and connect to "localhost" (Python 3.7+); Windows Server
        # 2022 resolves it to ::1 first, and every refused ::1 connect to the
        # IPv4 listener costs ~1s, pushing test__pywsgi past the runner's timeout.
        shell: pwsh
        run: netsh interface ipv6 set prefixpolicy ::ffff:0:0/96 60 4
      - name: Test gevent (skipped on 32-bit legs)
        if: ${{ matrix.wheel-only }}
        run: |
          echo "32-bit leg: wheel built without running the test suite, as upstream's appveyor.yml"
          echo "does for every 32-bit interpreter (GWHEEL_ONLY: true); the same code is tested on the"
          echo "64-bit Windows legs of this job."
      - name: Test gevent
        if: ${{ !matrix.wheel-only }}
        run: |
          python -c "import greenlet; print(greenlet, greenlet.__version__)"
          python -c "import gevent.core; print(gevent.core.loop)"
          python -c "import gevent; print(gevent.config.settings['resolver'].get_options())"
          python -c "from gevent._compat import get_clock_info; print(get_clock_info('perf_counter'))"
          bash .github/sealtest/run-tests.sh python -m gevent.tests --verbose --second-chance --config known_failures.py
      - name: Build gevent wheel
        run: |
          python -m pip install wheel cython setuptools cffi twine
          python -m pip wheel --no-build-isolation . -w dist
          ls -l dist
      - name: Upload gevent wheel
        uses: actions/upload-artifact@v4
        with:
          name: gevent-Windows-${{ matrix.python-version }}-${{ matrix.arch }}.whl
          path: dist/gevent*whl
          if-no-files-found: error
      - name: Test summaries of every test step in this job
        if: always()
        shell: bash
        run: |
          f="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/gevent-test-summaries.txt"
          if [ -f "$f" ]; then cat "$f"; else echo "No gevent test step ran in this job."; fi

